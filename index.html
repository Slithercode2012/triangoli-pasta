<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangoli Pasta</title>
    <link id="favicon" rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/0/01/El_Sato_Tux_The_penguin_in_sonic_style.png">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #a855f7; 
            --accent: #22c55e; 
            --bg: #020617; 
            --text: #ffffff; 
            --card: rgba(30, 41, 59, 0.5); 
            --card-border: rgba(255, 255, 255, 0.1);
            --radius: 1.2rem;
            --font-main: 'Chewy', cursive;
            --grid-cols: 6;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: var(--font-main);
            transition: background 0.3s ease, color 0.3s ease; 
            overflow-x: hidden; 
            min-height: 100vh;
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            padding-bottom: 70px;
        }

        #particle-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
        
        .main-logo-container { display: flex; justify-content: center; align-items: center; padding-top: 20px; margin-bottom: 10px; }
        .main-logo { width: 320px; height: auto; filter: drop-shadow(0 0 15px var(--primary)); cursor: pointer; transition: transform 0.3s ease; }
        .main-logo:hover { transform: scale(1.05); }

        .custom-logo-text {
            font-family: 'Fredoka', 'Chewy', cursive;
            font-weight: 700;
            font-size: 3.5rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary) 0%, #fbbf24 50%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px var(--primary)) drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
            text-align: center;
        }
        .custom-logo-text:hover { transform: scale(1.04); }

        /* Dynamic Responsive Island Header */
        .island-header {
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(15px);
            border: 1px solid var(--card-border); 
            border-radius: 99px;
            padding: 10px 24px; 
            display: flex; 
            align-items: center; 
            gap: 16px;
            margin: 10px auto 30px; 
            width: fit-content;
            max-width: 95vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 40;
        }

        .nav-icon { 
            font-size: 1.3rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            opacity: 0.9;
            color: var(--text);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .nav-icon:hover { color: var(--primary) !important; opacity: 1; transform: scale(1.1); }
        
        .penguin-nav-btn { height: 38px; width: 38px; object-fit: contain; cursor: pointer; transition: filter 0.3s; }
        .penguin-nav-btn:hover { filter: drop-shadow(0 0 8px var(--primary)); }

        #gameGrid {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
            gap: 1.25rem;
        }

        .game-card-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        .game-card {
            position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; border-radius: var(--radius);
            border: 2px solid var(--card-border); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--card); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .game-card:hover { 
            border-color: var(--primary) !important; 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 0 20px 2px var(--primary) !important; 
        }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-title {
            position: absolute; bottom: -100%; left: 0; width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.95));
            color: #ffffff !important;
            padding: 20px 8px 10px; text-align: center; transition: bottom 0.3s ease; font-size: 0.85rem;
        }
        .game-card:hover .card-title { bottom: 0; }

        .pin-btn {
            position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8);
            color: #fff; border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; z-index: 10; opacity: 0; transition: opacity 0.2s, transform 0.2s;
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
        }
        .game-card-wrapper:hover .pin-btn { opacity: 1; }
        .pin-btn:hover { transform: scale(1.15); background: var(--primary); }

        /* Links/Backups Icon Container */
        .link-icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 8px;
            text-align: center;
            padding: 10px;
        }
        .link-icon-card i {
            font-size: 2.2rem;
            transition: transform 0.2s ease;
        }
        .game-card:hover .link-icon-card i {
            transform: scale(1.15);
        }

        /* Universal Dynamic Dock Items */
        #pinnedItemsContainer {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            overflow-x: auto;
            max-width: 300px;
            padding: 2px 4px;
        }
        #pinnedItemsContainer::-webkit-scrollbar { display: none; }

        .os-pinned-item {
            width: 36px; height: 36px; border-radius: 10px; overflow: hidden;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative;
            flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.4);
        }
        .os-pinned-item:hover { transform: scale(1.15) translateY(-2px); box-shadow: 0 4px 12px var(--primary); }
        .os-pinned-item img { width: 100%; height: 100%; object-fit: cover; }
        .os-pinned-item .unpin-icon {
            position: absolute; top: -2px; right: -2px; background: rgba(239, 68, 68, 0.9);
            border-radius: 50%; width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s; color: white; font-size: 0.6rem; z-index: 12;
        }
        .os-pinned-item:hover .unpin-icon { opacity: 1; }

        #settingsPanel, #infoTabContent {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            font-family: 'Inter', sans-serif !important;
        }
        #settingsPanel *, #infoTabContent * { color: #f8fafc; }
        #settingsPanel input[type="text"], #settingsPanel select {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border-color: #334155 !important;
        }

        #settingsPanel { z-index: 100; transition: transform 0.4s ease; }
        .game-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; height: calc(100vh - 100px); padding: 20px; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .download-here-link { color: #3b82f6; font-weight: bold; cursor: pointer; text-decoration: underline; }

        /* ==================== PRESET THEMES ==================== */

        /* 1. DEFAULT DARK GLASS */
        body[data-theme="default"] { --bg: #020617; --text: #ffffff; --card: rgba(30, 41, 59, 0.5); }

        /* 2. EDUCATIONAL CURRICULUM */
        body[data-theme="educational"] { 
            --bg: #0f172a; 
            --font-main: 'Inter', sans-serif; 
            --radius: 0.75rem; 
            --card: #1e293b;
        }
        body[data-theme="educational"] .game-card { 
            aspect-ratio: 16/9; 
            border: 1px solid #334155; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 1rem;
            text-align: center;
        }
        body[data-theme="educational"] .edu-module-badge { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--primary); 
            margin-bottom: 4px;
        }
        body[data-theme="educational"] .edu-module-title { 
            font-size: 0.85rem; 
            color: #94a3b8; 
            font-weight: 500;
            line-height: 1.2;
        }

        /* 3. iOS IPAD OS SCREEN */
        body[data-theme="ios"] {
            --bg: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=2070&auto=format&fit=crop');
            --text: #ffffff; --font-main: 'Inter', sans-serif;
            padding-bottom: 100px;
        }
        body[data-theme="ios"] .main-logo-container { display: none; }
        body[data-theme="ios"] #gameGrid { gap: 2rem 1.5rem; padding: 20px; max-width: 1100px; margin: 0 auto; }
        body[data-theme="ios"] .game-card { aspect-ratio: 1/1; border-radius: 22%; border: none; box-shadow: 0 8px 20px rgba(0,0,0,0.3); background: rgba(255,255,255,0.18); }
        body[data-theme="ios"] .game-card:hover { border: 2px solid var(--primary) !important; box-shadow: 0 0 20px 2px var(--primary) !important; }
        body[data-theme="ios"] .game-card .card-title { display: none; }
        body[data-theme="ios"] .app-label {
            display: block !important; margin-top: 8px; font-size: 0.8rem; font-weight: 500; text-align: center; color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
        }
        body[data-theme="ios"] .island-header { 
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); margin: 0; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(35px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 32px; padding: 10px 20px; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.4); gap: 14px;
        }
        body[data-theme="ios"] .island-header .nav-icon { color: #1c1c1e !important; text-shadow: none; font-size: 1.3rem; }

        /* 4. WINDOWS 11 DESKTOP */
        body[data-theme="win11"] {
            --bg: url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1974&auto=format&fit=crop');
            --text: #ffffff; --font-main: 'Inter', sans-serif;
            padding-bottom: 60px;
        }
        body[data-theme="win11"] .main-logo-container { display: none; }
        body[data-theme="win11"] #gameGrid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 1.2rem; padding: 20px; }
