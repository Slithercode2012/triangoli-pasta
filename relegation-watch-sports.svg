<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" role="img" aria-label="Relegation Watch Sports header banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#071a3b"/>
      <stop offset="100%" stop-color="#0b2f78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="300" rx="18" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <text x="40" y="185"
          font-size="128"
          font-weight="900"
          font-family="Arial Black, Impact, sans-serif"
          letter-spacing="2"
          fill="#f8fafc"
          style="paint-order:stroke; stroke:#0d1324; stroke-width:10; stroke-linejoin:round;">
      <tspan fill="#f8fafc">RELEGATION</tspan>
      <tspan dx="22" fill="#f8fafc">WATCH</tspan>
      <tspan dx="22" fill="#f4d45d">SPORTS</tspan>
    </text>

    <text x="1280" y="175"
          font-size="52"
          font-weight="900"
          font-family="Arial Black, Impact, sans-serif"
          letter-spacing="3"
          fill="#f4d45d"
          style="paint-order:stroke; stroke:#0d1324; stroke-width:5; stroke-linejoin:round;">
      SCORES
    </text>
  </g>
</svg>
